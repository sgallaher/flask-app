<!DOCTYPE html>
<html lang="en">
<head>
  <title>Secure Chat</title>
  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>

  <!-- Default theme (WhatsApp) -->
  <link id="theme-stylesheet" rel="stylesheet" href="{{ url_for('static', filename='css/whatsapp.css') }}">

</head>
<body>
  <header>
    <h2>Chat Room</h2>
    {% if role == 'host' %}
      <p>Share this link: <strong>{{ request.url.replace('role=host', 'role=guest') }}</strong></p>
      <button onclick="endChat()">End Chat</button>
    {% endif %}
    <!-- Theme Toggle Button -->
    <button id="theme-toggle">Switch Theme</button>
  </header>

  <div id="chat-box"></div>
  <p id="typing"></p>
  <footer>
    <input id="message" placeholder="Type a message..." maxlength="255" oninput="notifyTyping()" onkeypress="checkEnter(event)" />
    <button onclick="sendMessage()">Send</button>
  </footer>

  <script>
    const socket = io();
    const room = "{{ token }}";
    const role = "{{ role }}";
    const username = prompt("Enter your name:");

    socket.emit("join", { room, username, role });

    socket.on("message", data => {
      const chatBox = document.getElementById("chat-box");
      const messageElement = document.createElement("p");
      messageElement.innerHTML = `<strong>${data.username}:</strong> ${data.msg}`;
      chatBox.appendChild(messageElement);
      chatBox.scrollTop = chatBox.scrollHeight;
      document.getElementById("typing").innerText = "";
    });

    socket.on("typing", data => {
      document.getElementById("typing").innerText = `${data.username} is typing...`;
      setTimeout(() => {
        document.getElementById("typing").innerText = "";
      }, 2000);
    });

    socket.on("chat_ended", () => {
      alert("The chat has been ended by the host.");
      document.body.innerHTML = "<h2>Chat session ended.</h2>";
    });

    socket.on("access_denied", data => {
      alert("Access denied: " + data.reason);
      document.body.innerHTML = `<h2 style="padding:20px;">Access denied: ${data.reason}</h2>`;
    });

    function sendMessage() {
      const msgInput = document.getElementById("message");
      const msg = msgInput.value.trim();
      if (msg.length === 0 || msg.length > 255) return;
      socket.emit("message", { msg, room, username });
      msgInput.value = "";
    }

    function notifyTyping() {
      socket.emit("typing", { room, username });
    }

    function endChat() {
      if (confirm("Are you sure you want to end the chat for everyone?")) {
        socket.emit("end_chat", { room });
      }
    }

    function checkEnter(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }
    }

    // Theme Switching Logic
    let currentTheme = 'whatsapp';  // Default theme

    document.getElementById("theme-toggle").addEventListener("click", function() {
      let themeLink = document.getElementById('theme-stylesheet');
      
      if (currentTheme === 'whatsapp') {
        themeLink.setAttribute('href', '{{ url_for("static", filename="css/messenger.css") }}');
        currentTheme = 'messenger';
      } else if (currentTheme === 'messenger') {
        themeLink.setAttribute('href', '{{ url_for("static", filename="css/imessage.css") }}');
        currentTheme = 'imessage';
      } else {
        themeLink.setAttribute('href', '{{ url_for("static", filename="css/whatsapp.css") }}');
        currentTheme = 'whatsapp';
      }
    });
  </script>
</body>
</html>
