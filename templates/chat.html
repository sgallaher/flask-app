<!DOCTYPE html>
<html>
<head>
  <title>Secure Chat</title>
  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    #chat-box { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: scroll; margin-bottom: 10px; }
    #message { width: 70%; }
    #typing { font-style: italic; color: grey; }
    #status { color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Chat Room</h2>

  {% if role == 'host' %}
    <h3>Invite your friend:</h3>
    <p>Share this link: 
      <strong id="share-link">{{ url_root }}chat/{{ token }}?role=guest</strong>
      <button onclick="copyLink()">Copy</button>
    </p>
    <p id="status">Waiting for your friend to join...</p>
    <button onclick="endChat()">End Chat</button>
  {% endif %}

  <div id="chat-box"></div>
  <p id="typing"></p>
  <input id="message" placeholder="Type a message..." oninput="notifyTyping()" />
  <button onclick="sendMessage()">Send</button>

  <script>
    const socket = io();
    const room = "{{ token }}";
    const role = "{{ role }}";
    const username = prompt("Enter your name:") || `Anonymous_${Math.floor(Math.random() * 1000)}`;

    socket.emit("join", { room, username });

    socket.on("message", data => {
      const chatBox = document.getElementById("chat-box");
      const messageElement = document.createElement("p");
      messageElement.innerHTML = `<strong>${data.username}:</strong> ${data.msg}`;
      chatBox.appendChild(messageElement);
      chatBox.scrollTop = chatBox.scrollHeight;

      // If this is a "joined the chat" system message, notify host
      if (role === "host" && data.msg.includes("has joined")) {
        document.getElementById("status").innerText = `${data.username} has joined the chat.`;
      }

      document.getElementById("typing").innerText = ""; // clear typing
    });

    socket.on("typing", data => {
      document.getElementById("typing").innerText = `${data.username} is typing...`;
      setTimeout(() => {
        document.getElementById("typing").innerText = "";
      }, 2000);
    });

    socket.on("chat_ended", () => {
      alert("The chat has been ended by the host.");
