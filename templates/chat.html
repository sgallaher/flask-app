<!DOCTYPE html>
<html>
<head>
  <title>Secure Chat</title>
  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ece5dd;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #075e54;
      color: white;
      padding: 10px;
      text-align: center;
    }
    #chat-box {
      flex-grow: 1;
      padding: 10px;
      overflow-y: auto;
      background: #e5ddd5;
    }
    #chat-box p {
      background: #dcf8c6;
      padding: 10px;
      border-radius: 7px;
      margin-bottom: 10px;
      max-width: 60%;
    }
    #typing {
      color: grey;
      font-style: italic;
      margin-left: 10px;
    }
    footer {
      display: flex;
      background: #f0f0f0;
      padding: 10px;
      border-top: 1px solid #ccc;
    }
    #message {
      flex-grow: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 20px;
      margin-right: 10px;
    }
    button {
      background-color: #25d366;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h2>Chat Room</h2>
    {% if role == 'host' %}
      <p>Share this link: <strong>{{ request.url.replace('role=host', 'role=guest') }}</strong></p>
      <button onclick="endChat()">End Chat</button>
    {% endif %}
  </header>

  <div id="chat-box"></div>
  <p id="typing"></p>
  <footer>
    <input id="message" placeholder="Type a message..." maxlength="255" oninput="notifyTyping()" onkeypress="checkEnter(event)" />
    <button onclick="sendMessage()">Send</button>
  </footer>

  <script>
    const socket = io();
    const room = "{{ token }}";
    const role = "{{ role }}";
    const username = prompt("Enter your name:");

    socket.emit("join", { room, username, role });

    socket.on("message", data => {
      const chatBox = document.getElementById("chat-box");
      const messageElement = document.createElement("p");
      messageElement.innerHTML = `<strong>${data.username}:</strong> ${data.msg}`;
      chatBox.appendChild(messageElement);
      chatBox.scrollTop = chatBox.scrollHeight;
      document.getElementById("typing").innerText = "";
    });

    socket.on("typing", data => {
      document.getElementById("typing").innerText = `${data.username} is typing...`;
      setTimeout(() => {
        document.getElementById("typing").innerText = "";
      }, 2000);
    });

    socket.on("chat_ended", () => {
      alert("The chat has been ended by the host.");
      document.body.innerHTML = "<h2>Chat session ended.</h2>";
    });

    socket.on("access_denied", data => {
      alert("Access denied: " + data.reason);
      document.body.innerHTML = `<h2 style="padding:20px;">Access denied: ${data.reason}</h2>`;
    });

    function sendMessage() {
      const msgInput = document.getElementById("message");
      const msg = msgInput.value.trim();
      if (msg.length === 0 || msg.length > 255) return;
      socket.emit("message", { msg, room, username });
      msgInput.value = "";
    }

    function notifyTyping() {
      socket.emit("typing", { room, username });
    }

    function endChat() {
      if (confirm("Are you sure you want to end the chat for everyone?")) {
        socket.emit("end_chat", { room });
      }
    }

    function checkEnter(event) {
      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }
    }
  </script>
</body>
</html>
