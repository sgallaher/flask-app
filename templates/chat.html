<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Chat</title>
  <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
  <style>
    /* Reset some defaults */
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      height: 100%;
    }

    /* Container to ensure layout doesn't stretch too much */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Header bar */
    .header {
      background-color: #25D366;
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h3 {
      margin: 0;
    }
    .header .status {
      font-size: 14px;
      color: #ffffff;
      opacity: 0.7;
    }

    /* Chat box area */
    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: #e5ddd5;
      display: flex;
      flex-direction: column;
    }

    /* Message styles */
    .message {
      max-width: 80%;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 10px;
      display: inline-block;
      word-wrap: break-word;
    }
    .message.left {
      background-color: #f1f0f0;
      align-self: flex-start;
    }
    .message.right {
      background-color: #dcf8c6;
      align-self: flex-end;
    }

    /* Typing indicator */
    #typing {
      font-style: italic;
      color: grey;
      font-size: 14px;
      margin-top: 5px;
    }

    /* Footer with input */
    .footer {
      display: flex;
      padding: 10px;
      background-color: white;
      border-top: 1px solid #ccc;
      align-items: center;
    }

    #message {
      flex: 1;
      padding: 10px;
      border-radius: 20px;
      border: 1px solid #ccc;
      margin-right: 10px;
      font-size: 14px;
      background-color: #f1f1f1;
    }

    button {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }

    /* Hide the share link in chat */
    #share-link {
      display: none;
    }

    /* Chat ended message */
    .chat-ended {
      text-align: center;
      font-size: 20px;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="chat-container">

    <div class="header">
      <h3>Chat Room</h3>
      {% if role == 'host' %}
        <span class="status">Waiting for your friend...</span>
      {% endif %}
    </div>

    <div id="chat-box"></div>
    <p id="typing"></p>

    <div class="footer">
      <input id="message" placeholder="Type a message..." oninput="notifyTyping()" />
      <button onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script>
    const socket = io();
    const room = "{{ token }}";
    const role = "{{ role }}";
    const username = prompt("Enter your name:") || `Anonymous_${Math.floor(Math.random() * 1000)}`;

    // Emit join message when user enters the chat
    socket.emit("join", { room, username });

    socket.on("message", data => {
      const chatBox = document.getElementById("chat-box");
      const messageElement = document.createElement("div");
      messageElement.classList.add("message");
      messageElement.classList.add(data.username === username ? "right" : "left");
      messageElement.innerHTML = `<strong>${data.username}:</strong> ${data.msg}`;
      chatBox.appendChild(messageElement);
      chatBox.scrollTop = chatBox.scrollHeight; // Scroll to bottom

      // Host sees when guest joins
      if (role === "host" && data.msg.includes("has joined")) {
        document.querySelector('.status').innerText = `${data.username} has joined the chat.`;
      }

      document.getElementById("typing").innerText = ""; // Clear typing message
    });

    socket.on("typing", data => {
      document.getElementById("typing").innerText = `${data.username} is typing...`;
      setTimeout(() => {
        document.getElementById("typing").innerText = "";
      }, 2000);
    });

    socket.on("chat_ended", () => {
      alert("The chat has been ended by the host.");
      document.body.innerHTML = "<h2 class='chat-ended'>Chat session ended.</h2>";
    });

    // Send message when button is clicked or Enter is pressed
    function sendMessage() {
      const msgInput = document.getElementById("message");
      const msg = msgInput.value.trim();
      if (msg === "") return; // Don't send empty messages
      socket.emit("message", { msg, room, username });
      msgInput.value = "";
    }

    function notifyTyping() {
      socket.emit("typing", { room, username });
    }

    // Listen for Enter key press
    document.getElementById("message").addEventListener("keypress", function(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault(); // Prevent the new line
        sendMessage();
      }
    });

    function endChat() {
      if (confirm("Are you sure you want to end the chat for everyone?")) {
        socket.emit("end_chat", { room });
      }
    }
  </script>

</body>
</html>
